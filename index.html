<head>

<style>
:root{--bg:#efe7dc;--paper:#fbf8f3;--card:#fffdf9;--ink:#302a25;--muted:#786f66;--line:#ddd3c6;--brown:#5d4637;--accent:#b16f4e;--sage:#78866f;--danger:#9c5048;--shadow:0 18px 55px rgba(58,42,30,.12)}

.wrap,.panel{max-width:1180px;margin:auto;padding:24px 18px 70px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.heroMain,.heroSide{min-height:430px;border-radius:32px;overflow:hidden;box-shadow:var(--shadow)}.heroMain{position:relative;background:linear-gradient(135deg,#705543,#c1aa92 55%,#e7d9c6)}.heroMain:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(40,26,18,.62),transparent 60%)}

.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 14px;border-radius:999px}.btn.primary{background:var(--brown);border-color:var(--brown);color:#fff}.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{background:#fff2ef;color:var(--danger);border-color:#e4c1bb}
.heroSide{background:var(--paper);padding:25px;display:flex;flex-direction:column;justify-content:space-between}.heroSide h2{font:500 34px/1.05 Georgia,serif;margin:8px 0}.muted{color:var(--muted)}
.photo{height:230px;border-radius:22px;background:linear-gradient(135deg,#cbb9a5,#987a61 60%,#5b4335);display:grid;place-items:center;color:rgba(255,255,255,.8);font:24px Georgia,serif;text-align:center;padding:20px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.metaBox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px}.metaBox small{display:block;color:var(--muted)}.metaBox strong{display:block;margin-top:4px}
.section{margin-top:32px}.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:14px}.sectionHead h2{font:500 34px/1 Georgia,serif;margin:5px 0}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.chip{white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--muted);border-radius:999px;padding:9px 13px}.chip.active{background:var(--brown);color:#fff;border-color:var(--brown)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid rgba(93,70,55,.1);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(71,53,40,.06);transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(71,53,40,.1)}
.pic{aspect-ratio:1.08;background:linear-gradient(135deg,#d7c1aa,#a18167 58%,#604839);display:grid;place-items:center;text-align:center;color:rgba(255,255,255,.8);font:18px Georgia,serif;padding:18px;position:relative}.badge{position:absolute;left:10px;top:10px;background:rgba(255,253,249,.9);border:1px solid rgba(255,255,255,.6);color:var(--brown);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:6px 8px;border-radius:999px}
.body{padding:14px}.title{font-weight:800;line-height:1.25}.desc{font-size:12px;color:var(--muted);line-height:1.45;min-height:36px;margin-top:6px}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:13px}.price{font-weight:800;color:var(--brown)}.plus{width:36px;height:36px;border:0;border-radius:50%;background:var(--brown);color:#fff;font-size:20px}
.search{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 13px;min-width:220px}.infoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:25px}.info{padding:19px;border:1px solid var(--line);border-radius:21px;background:rgba(255,255,255,.62)}.info strong{display:block;font:500 20px Georgia,serif;margin-bottom:5px}.info span{font-size:13px;color:var(--muted);line-height:1.5}
.floating{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;background:var(--brown);color:#fff;padding:12px 16px;border-radius:999px;box-shadow:0 16px 35px rgba(49,36,27,.28);display:none;gap:10px;align-items:center}.floating.show{display:flex}.count{width:24px;height:24px;border-radius:50%;background:#fff;color:var(--brown);display:grid;place-items:center;font-size:12px;font-weight:800}
.drawer,.modal{position:fixed;inset:0;z-index:70;background:rgba(24,18,14,.45);backdrop-filter:blur(5px);display:none}.drawer.open{display:flex;justify-content:flex-end}.modal.open{display:flex;align-items:center;justify-content:center;padding:18px}
.drawerPanel{width:min(520px,100%);height:100%;overflow:auto;background:var(--paper);padding:22px;box-shadow:-20px 0 60px rgba(0,0,0,.18)}.modalCard{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:28px;padding:22px}
.drawerHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.drawerHead h2{font:500 30px Georgia,serif;margin:0}.close{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:#fff}
.cartRow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:15px 0;border-bottom:1px solid var(--line)}.qty{display:flex;gap:8px;align-items:center}.qty button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:50%}
.form{display:grid;gap:11px;margin-top:18px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;outline:none}.field textarea{min-height:80px;resize:vertical}
.cashBox{padding:13px;border:1px dashed #c7b29a;border-radius:18px;background:#f7efe4}.total{display:flex;justify-content:space-between;font-weight:800;font-size:18px}.submit{width:100%;border:0;border-radius:15px;background:var(--brown);color:#fff;padding:14px;font-weight:800}
.detail{display:grid;grid-template-columns:.9fr 1.1fr;gap:20px}.detailImg{min-height:330px;border-radius:23px;background:linear-gradient(135deg,#d9c3ab,#9d7c61 58%,#5a4334);display:grid;place-items:center;color:#fff;font:26px Georgia,serif;text-align:center;padding:24px}.options{display:flex;gap:7px;flex-wrap:wrap}.option{padding:9px 12px;border:1px solid var(--line);background:#fff;border-radius:999px}.option.active{background:var(--brown);border-color:var(--brown);color:#fff}
.panelHeader{display:flex;justify-content:space-between;gap:15px;align-items:start;flex-wrap:wrap}.panelHeader h1{font:500 50px/.95 Georgia,serif;margin:6px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:17px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:6px}
.cols{display:grid;grid-template-columns:1.35fr .65fr;gap:17px;margin-top:18px}.panelCard{background:var(--paper);border:1px solid var(--line);border-radius:25px;padding:19px}.orders{display:grid;gap:11px;margin-top:13px}.order{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.orderTop{display:flex;justify-content:space-between;gap:10px}.status{font-size:11px;font-weight:800;padding:7px 9px;border-radius:999px;background:#efe5da;color:var(--brown)}.items{font-size:13px;color:var(--muted);line-height:1.55;margin:10px 0}.orderActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.orderActions button{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:11px}.orderActions .primary{background:var(--brown);border-color:var(--brown);color:#fff}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.tabs button{border:1px solid var(--line);background:var(--paper);padding:9px 12px;border-radius:999px}.tabs button.active{background:var(--brown);color:#fff;border-color:var(--brown)}
.adminGrid{display:grid;grid-template-columns:220px 1fr;gap:17px;margin-top:18px}.adminNav{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:9px;height:max-content}.adminNav button{width:100%;border:0;background:transparent;text-align:left;padding:11px;border-radius:12px;color:var(--muted)}.adminNav button.active{background:#ebe0d4;color:var(--brown);font-weight:800}
.row{display:grid;grid-template-columns:54px 1.3fr .7fr .4fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.thumb{width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,#d7c1aa,#8f6d56)}.row small{display:block;color:var(--muted);margin-top:3px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 7px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted)}
.analytics{display:grid;grid-template-columns:1fr 1fr;gap:15px}.bars{height:220px;display:flex;align-items:end;gap:8px;padding-top:18px}.bar{flex:1;background:linear-gradient(to top,#7b5d49,#cbb29a);border-radius:9px 9px 4px 4px;min-height:8px;position:relative}.bar span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:18px;padding:35px;text-align:center;color:var(--muted)}.toast{position:fixed;right:17px;bottom:17px;z-index:120;background:#2d2823;color:#fff;padding:12px 15px;border-radius:13px;display:none;box-shadow:var(--shadow)}.toast.show{display:block}
@media(max-width:980px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,1fr)}.cols,.adminGrid{grid-template-columns:1fr}.adminNav{display:flex;overflow:auto}.adminNav button{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.topin,.wrap,.panel{padding-left:13px;padding-right:13px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.infoGrid{grid-template-columns:1fr}.analytics{grid-template-columns:1fr}.detail{grid-template-columns:1fr}.heroMain,.heroSide{border-radius:25px}.heroMain{min-height:500px}.heroSide{min-height:500px}.sectionHead{align-items:start;flex-direction:column}.search{width:100%;min-width:0}.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:48px 1fr auto}.row .hide{display:none}.panelHeader h1{font-size:40px}}

/* ===== POLISHED SHOWCASE OVERRIDES ===== */
:root{
  --bg:#e9e0d4;
  --paper:rgba(255,252,247,.94);
  --card:#fffdf9;
  --ink:#2a2521;
  --muted:#756b61;
  --line:rgba(93,70,55,.16);
  --brown:#513b2f;
  --brown-2:#6f5342;
  --accent:#b56f4c;
  --sage:#71816b;
  --cream:#f7f0e6;
  --shadow:0 24px 70px rgba(60,43,31,.13);
}
body{
  background:
    radial-gradient(circle at 8% 0%,rgba(255,255,255,.65),transparent 28%),
    radial-gradient(circle at 94% 12%,rgba(183,145,111,.16),transparent 24%),
    linear-gradient(180deg,#eee6dc 0%,#e9e0d4 100%);
}
.top{
  background:rgba(245,239,231,.82);
  border-bottom:1px solid rgba(93,70,55,.12);
  box-shadow:0 8px 28px rgba(67,48,35,.05);
}
.topin{padding:10px 18px}
.brand{font-weight:600;letter-spacing:.02em}
.logo{
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.15),0 8px 20px rgba(63,43,31,.18);
}
.wrap,.panel{padding-top:30px}
.hero{gap:22px}
.heroMain{
  min-height:520px;
  background:
    radial-gradient(circle at 76% 17%,rgba(255,244,224,.38),transparent 17%),
    radial-gradient(circle at 18% 78%,rgba(255,255,255,.14),transparent 23%),
    linear-gradient(135deg,#5b4436 0%,#92735b 44%,#d6c2a9 100%);
}
.heroMain:before{
  content:"";
  position:absolute;
  inset:18px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:24px;
  z-index:1;
  pointer-events:none;
}
.heroCopy{left:42px;right:42px;bottom:42px}
.hero h1{letter-spacing:-.04em;text-shadow:0 8px 30px rgba(28,18,12,.24)}
.hero p{font-size:15px;max-width:560px}
.heroSide{
  min-height:520px;
  border:1px solid rgba(93,70,55,.09);
  box-shadow:var(--shadow);
}
.heroSide h2{letter-spacing:-.03em}
.photo{
  height:255px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 24% 28%,rgba(255,255,255,.36),transparent 16%),
    radial-gradient(circle at 78% 22%,rgba(255,238,207,.34),transparent 18%),
    linear-gradient(135deg,#cdb9a1,#9a765d 54%,#594236);
}
.photo:before{
  content:"";
  position:absolute;
  width:190px;height:190px;
  border-radius:50%;
  left:50%;top:54%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 30%,#f8eee0 0 20%,#c7a98c 22% 39%,#7c5d49 41% 60%,rgba(55,38,27,.85) 62% 100%);
  box-shadow:0 24px 50px rgba(41,27,18,.28);
}
.photo:after{
  content:"";
  position:absolute;
  width:120px;height:54px;
  border-radius:0 0 70px 70px;
  left:50%;top:52%;
  transform:translate(-50%,-50%);
  border:7px solid rgba(255,249,238,.72);
  border-top:0;
  opacity:.8;
}
.photo{font-size:0}
.metaBox{background:rgba(255,255,255,.72);backdrop-filter:blur(8px)}
.section{margin-top:44px}
.sectionHead h2{letter-spacing:-.03em}
.chips{padding:4px 0 12px}
.chip{background:rgba(255,255,255,.6);backdrop-filter:blur(8px)}
.grid{gap:16px}
.card{
  border-radius:25px;
  border-color:rgba(93,70,55,.12);
  box-shadow:0 12px 34px rgba(71,53,40,.06);
}
.card:hover{transform:translateY(-5px) scale(1.005)}
.pic{
  min-height:178px;
  background:
    radial-gradient(circle at 75% 24%,rgba(255,255,255,.32),transparent 15%),
    linear-gradient(135deg,#dcc7b0,#aa8870 56%,#694e3d);
}
.pic:before{
  content:"";
  position:absolute;
  width:82px;height:82px;
  border-radius:50%;
  left:50%;top:52%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle at 30% 26%,#fff8ec 0 16%,#b88d6b 18% 42%,#5a4030 45% 68%,#2f2119 70% 100%);
  opacity:.8;
  box-shadow:0 16px 30px rgba(45,29,20,.22);
}
.pic small,.pic br{position:relative;z-index:2}
.pic small{display:none}
.body{padding:17px}
.title{font-size:15px}
.desc{font-size:12px;line-height:1.5}
.plus{
  box-shadow:0 7px 17px rgba(72,49,35,.18);
  transition:.18s ease;
}
.plus:hover{transform:scale(1.08)}
.infoGrid{gap:14px}
.info{
  box-shadow:0 9px 30px rgba(71,53,40,.04);
  backdrop-filter:blur(8px);
}
.floating{
  padding:13px 18px;
  min-width:220px;
  justify-content:center;
}
.drawerPanel,.modalCard{
  border-left:1px solid rgba(93,70,55,.08);
  box-shadow:-30px 0 90px rgba(0,0,0,.16);
}
.modalCard{border:1px solid rgba(93,70,55,.10);box-shadow:0 30px 100px rgba(32,23,16,.24)}
.detailImg{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 30% 25%,rgba(255,255,255,.28),transparent 15%),
    linear-gradient(135deg,#dbc5ad,#9d7a60 58%,#574033);
}
.detailImg:before{
  content:"";
  position:absolute;
  width:190px;height:190px;border-radius:50%;
  left:50%;top:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 32% 24%,#fff8ed 0 18%,#c09b78 20% 42%,#71513e 44% 66%,#312219 68% 100%);
  opacity:.85;
}
.detailImg{font-size:0}
.detailImg:after{
  content:"Café 1988";
  position:absolute;bottom:18px;left:18px;
  font:600 11px Inter,sans-serif;
  letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.7);
}
.form input:focus,.form textarea:focus,.form select:focus,.search:focus{
  border-color:rgba(93,70,55,.45);
  box-shadow:0 0 0 4px rgba(181,111,76,.12);
}
.submit,.btn.primary{
  box-shadow:0 8px 20px rgba(72,49,35,.14);
}
.submit:hover,.btn.primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
.panelHeader h1{letter-spacing:-.04em}
.stat{
  box-shadow:0 9px 25px rgba(71,53,40,.05);
}
.panelCard{
  box-shadow:0 10px 32px rgba(71,53,40,.05);
}
.order{
  transition:.18s ease;
}
.order:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(71,53,40,.08)}
.status{border:1px solid rgba(93,70,55,.08)}
.row{transition:.15s ease}
.row:hover{background:rgba(255,255,255,.4)}
.row .btn,.adminNav button,.tabs button,.orderActions button{transition:.16s ease}
.row .btn:hover,.adminNav button:hover,.tabs button:hover,.orderActions button:hover{transform:translateY(-1px)}
.toast{
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 20px 50px rgba(20,14,10,.22);
}
@media(max-width:650px){
  .heroCopy{left:26px;right:26px;bottom:26px}
  .hero h1{font-size:56px}
  .grid{gap:11px}
  .card{border-radius:19px}
  .pic{min-height:145px}
  .body{padding:13px}
}


/* ===== BRAND SITE LAYER ===== */
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
:root{--cream:#FFF8F0;--brown:#8B5E3C;--dark:#3D2B1F;--orange:#E8956D;--gold:#D4A574;--lgold:#F0DFC8;--txt:#2C1810;--mut:#6B5344}
body{font-family:'Inter','Noto Sans KR',sans-serif;background:var(--cream);color:var(--txt);overflow-x:hidden}h1,h2,h3,.brand,.panelHeader h1{font-family:'Playfair Display',Georgia,serif}
.brand-nav{position:fixed;top:0;left:0;right:0;z-index:900;display:flex;align-items:center;justify-content:space-between;padding:18px 28px;transition:.3s}.brand-nav.scrolled{background:rgba(255,248,240,.96);backdrop-filter:blur(12px);box-shadow:0 2px 24px rgba(61,43,31,.12);padding:12px 28px}
.brand-logo{font-family:'Playfair Display',serif;font-weight:900;font-size:1.35rem;color:var(--dark);text-decoration:none}.brand-logo span{color:var(--orange)}
.brand-nav .nav-links{display:flex;gap:26px;list-style:none;margin:0;padding:0}.brand-nav .nav-links a{text-decoration:none;color:var(--txt);font-size:.78rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;transition:.2s}.brand-nav .nav-links a:hover{color:var(--orange)}
.brand-nav .nav-right{display:flex;align-items:center;gap:9px}.brand-nav .langs{display:flex;gap:5px}.brand-nav .lang-switch{padding:5px 10px;border:1px solid var(--brown);background:transparent;border-radius:20px;font-size:.7rem;font-weight:700;cursor:pointer;color:var(--brown)}.brand-nav .lang-switch.on{background:var(--brown);color:#fff}
.brand-nav .demo-mode,.brand-nav .mobile-menu{padding:7px 10px;border:1px solid rgba(139,94,60,.35);background:rgba(255,255,255,.55);border-radius:999px;color:var(--brown);font-size:10px;font-weight:800;cursor:pointer}.brand-nav .mobile-menu{display:none}

function toast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function save(){localStorage.setItem('r88_orders',JSON.stringify(S.orders));localStorage.setItem('r88_cart',JSON.stringify(S.cart))}
function count(){return S.cart.reduce((a,x)=>a+x.qty,0)}
function total(){return S.cart.reduce((a,x)=>a+x.price*x.qty,0)}
function product(id){return MENU.find(x=>x.id===id)}
function add(id,price=null,meta={}){const p=product(id);const key=id+'|'+(meta.temp||'')+'|'+(meta.top||'');const found=S.cart.find(x=>x.key===key);if(found)found.qty++;else S.cart.push({key,id,price:price||p.price,qty:1,temp:meta.temp||'',top:meta.top||''});save();render();toast('Added to order')}
function qty(key,d){const x=S.cart.find(i=>i.key===key);if(!x)return;x.qty+=d;if(x.qty<=0)S.cart=S.cart.filter(i=>i.key!==key);save();render();openCart()}

function closeModal(){$('modal').classList.remove('open')}
function openProduct(id){const p=product(id);let temp=p.temps?.[0]||'',top='';$('modal').innerHTML=`<div class="modalCard"><div class="drawerHead"><h2>${pname(p)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="detail"><div class="detailImg">${p.vi}<br><small style="font:12px Inter">Photo placeholder</small></div><div><div class="eyebrow muted">${p.cat}</div><div style="font-size:26px;font-weight:800;color:var(--brown);margin:9px 0">${full(p.price)}</div><p class="muted" style="line-height:1.6">${p.desc}</p>${p.temps?`<div style="margin-top:18px"><div class="muted" style="font-size:12px;margin-bottom:7px">Temperature</div><div class="options">${p.temps.map((x,i)=>`<button class="option ${i===0?'active':''}" data-v="${x}" onclick="pickOpt(this,'temp')">${x}</button>`).join('')}</div></div>`:''}<div style="margin-top:18px"><div class="muted" style="font-size:12px;margin-bottom:7px">Extra topping</div><div class="options"><button class="option active" data-v="" onclick="pickOpt(this,'top')">None</button>${TOPS.slice(0,5).map(x=>`<button class="option" data-v="${x.id}" onclick="pickOpt(this,'top')">${x.name} +${money(x.price)}</button>`).join('')}</div></div><button class="submit" style="margin-top:22px" onclick="addModal('${id}')">Add to order</button></div></div></div>`;$('modal').classList.add('open');window.choice={temp,top}}
function pickOpt(btn,type){btn.parentElement.querySelectorAll('.option').forEach(b=>b.classList.remove('active'));btn.classList.add('active');window.choice[type]=btn.dataset.v}
function addModal(id){const t=TOPS.find(x=>x.id===window.choice.top);add(id,product(id).price+(t?.price||0),{temp:window.choice.temp,top:t?.id||''});closeModal();openCart()}
function renderCart(){
  const hasActiveOrder = getActiveOrderForTable(S.table);
  if(hasActiveOrder){
    $('drawer').innerHTML=`<div class="drawerPanel"><div class="drawerHead"><h2>Active order</h2><button class="close" onclick="closeCart()">×</button></div><div class="cart-success"><div class="cart-success-icon">☕</div><h3>Order in progress</h3><p>Table ${S.table} already has an active order (${hasActiveOrder.id}). Please wait until it is completed before placing a new order.</p><button class="oc-btn primary" onclick="openOrderCabinet();closeCart()">View order status</button><button class="add-more-cta" style="margin-top:18px" onclick="brandScroll(\'menu\');closeCart()">Browse menu for next time</button></div></div>`;
    $('drawer').classList.add('open');
    return;
  }
  const items=S.cart.map(x=>{const p=product(x.id);const top=TOPS.find(t=>t.id===x.top);return `<div class="cart-item-row"><div class="cart-item-info"><strong>${pname(p)}</strong><div class="cart-item-meta">${x.temp||''}${top?' · '+top.name:''}</div><div class="cart-item-price">${full(x.price*x.qty)}</div></div><div class="cart-qty-control"><button onclick="qty('${x.key}',-1)">−</button><span class="cart-qty-val">${x.qty}</span><button onclick="qty('${x.key}',1)">+</button></div></div>`}).join('');
  const totalVal=total();
  $('drawer').innerHTML=`<div class="drawerPanel"><div class="drawerHead"><h2>Your order</h2><button class="close" onclick="closeCart()">×</button></div>${items||'<div class="empty" style="padding:40px;text-align:center;color:var(--muted)">Your cart is empty.<br><button class="add-more-cta" style="margin-top:16px" onclick="brandScroll(\'menu\')">Browse menu</button></div>'}${S.cart.length?`<div class="cart-actions-sticky"><div class="form"><div class="total" style="margin-bottom:12px"><span>Total</span><span>${full(totalVal)}</span></div><div class="field"><label>Name (optional)</label><input id="cname" value="${S.cartDraft.name||''}" oninput="S.cartDraft.name=this.value;saveDraft()"></div><div class="field"><label>Comment (optional)</label><textarea id="ccomment" oninput="S.cartDraft.comment=this.value;saveDraft()">${S.cartDraft.comment||''}</textarea></div><div class="field"><label>Payment</label><select id="pay" onchange="toggleCash();S.cartDraft.pay=this.value;saveDraft()"><option value="cash" ${S.cartDraft.pay!=='counter'?'selected':''}>Cash</option><option value="counter" ${S.cartDraft.pay==='counter'?'selected':''}>Pay at counter</option></select></div><div id="cashBox" class="cashBox" style="display:${S.cartDraft.pay==='cash'?'block':'none'}"><div class="field"><label>I pay with</label><input id="cash" type="number" placeholder="500000" value="${S.cartDraft.cash||''}" oninput="S.cartDraft.cash=this.value;saveDraft();calcChange()"></div><div id="change" class="muted" style="font-weight:800;margin-top:7px">Change: —</div></div><button class="submit" onclick="placeOrder()">Place order · ${money(totalVal)}</button></div><button class="add-more-cta" onclick="brandScroll(\'menu\');closeCart()">+ Add more items</button></div>`:''}</div>`;
  $('drawer').classList.add('open');
}
function toggleCash(){const v=$('pay')?.value;if($('cashBox'))$('cashBox').style.display=v==='cash'?'block':'none'}
function calcChange(){const v=Number($('cash')?.value||0);$('change').textContent='Change: '+(v?full(Math.max(0,v-total())):'—')}
function placeOrder(){
  const pay=$('pay').value,cash=Number($('cash')?.value||0);
  if(pay==='cash'&&cash>0&&cash<total()){toast('Cash amount is below total');return}
  const o={id:'R88-'+String(Date.now()).slice(-6),table:S.table,name:($('cname').value||'').trim(),comment:($('ccomment').value||'').trim(),payment:pay,cash,total:total(),status:'New',paymentStatus:'pending',items:S.cart.map(x=>({id:x.id,qty:x.qty,temp:x.temp,price:x.price})),createdAt:Date.now()};
  S.orders.unshift(o);
  setActiveOrderForTable(o);

}
function showOrder(id){const o=S.orders.find(x=>x.id===id);if(!o)return;$('modal').innerHTML=`<div class="modalCard"><div class="drawerHead"><h2>Order ${o.id}</h2><button class="close" onclick="closeModal()">×</button></div><div class="muted">Table ${o.table}${o.name?' · '+o.name:''}</div><div style="margin-top:18px;display:grid;gap:9px">${['New','Preparing','Ready','Paid'].map((s,i)=>{const cur=['New','Preparing','Ready','Paid'].indexOf(o.status);return `<div style="padding:13px;border-radius:15px;background:${i<=cur?'#ebe0d4':'#f7f3ee'}"><strong>${i<=cur?'●':'○'} ${s}</strong></div>`}).join('')}</div><div class="info" style="margin-top:15px"><strong>${full(o.total)}</strong><span>${o.payment==='cash'?'Cash':'Pay at counter'}${o.cash?` · Change ${full(Math.max(0,o.cash-o.total))}`:''}</span></div></div>`;$('modal').classList.add('open')}
function status(id,s){

function analyticsAdmin(){const revenue=S.orders.reduce((a,o)=>a+o.total,0),avg=S.orders.length?revenue/S.orders.length:0;const counts={};S.orders.forEach(o=>o.items.forEach(i=>counts[i.id]=(counts[i.id]||0)+i.qty));const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);return `<section class="panelCard"><div class="stats" style="margin:0"><div class="stat"><small>Orders</small><strong>${S.orders.length}</strong></div><div class="stat"><small>Revenue</small><strong>${money(revenue)}</strong></div><div class="stat"><small>Avg check</small><strong>${money(avg)}</strong></div><div class="stat"><small>Conversion</small><strong>14.8%</strong></div></div><div class="analytics" style="margin-top:16px"><div class="panelCard"><h2 style="font:500 27px Georgia,serif;margin:0">Sales by hour</h2><div class="bars">${[28,44,35,58,75,66,86,91,64,50,69,78].map((h,i)=>`<div class="bar" style="height:${h}%"><span>${i+8}</span></div>`).join('')}</div></div><div class="panelCard"><h2 style="font:500 27px Georgia,serif;margin:0">Top products</h2><table class="table" style="margin-top:10px"><thead><tr><th>Product</th><th>Qty</th></tr></thead><tbody>${top.map(([id,n])=>`<tr><td>${product(id)?.en||id}</td><td>${n}</td></tr>`).join('')}</tbody></table></div></div><div class="infoGrid"><div class="info"><strong>1,242</strong><span>Menu views</span></div><div class="info"><strong>420</strong><span>Add to cart</span></div><div class="info"><strong>${S.orders.length}</strong><span>Orders</span></div></div></section>`}
function infoAdmin(){return `<section class="panelCard"><h2 style="font:500 30px Georgia,serif;margin:0">Cafe information</h2><div class="form"><div class="field"><label>Name</label><input value="Reply 1988"></div><div class="field"><label>Address</label><input value="20 Lê Hồng Phong, Hải Châu, Đà Nẵng"></div><div class="field"><label>Hours</label><input value="07:30–00:00 · Every day"></div><div class="field"><label>Google Maps</label><input value="https://maps.google.com/"></div><div class="field"><label>Facebook</label><input value="https://www.facebook.com/Reply1988Cafe"></div><button class="btn primary" onclick="toast('Saved in demo mode')">Save changes</button></div></section>`}
function simulate(){
  const occupied=new Set(S.orders.filter(o=>o.status!=='Paid').map(o=>String(o.table)));
  const available=Array.from({length:24},(_,i)=>String(i+1).padStart(2,'0')).filter(t=>!occupied.has(t));
  if(!available.length){toast('All tables already have active orders');return;}
  const table=available[Math.floor(Math.random()*available.length)];
  const o={id:'R88-'+String(Date.now()).slice(-6),table,name:'Demo Guest',comment:'Less ice',payment:'cash',cash:100000,total:45000,status:'New',paymentStatus:'pending',source:'staff-demo',items:[{id:'egg',qty:1,price:45000}],createdAt:Date.now()};
  S.orders.unshift(o);
  setActiveOrderForTable(o);
  save();render();toast(`New order · Table ${table}`);
}
function exportCSV(){const h=['id','table','name','total','payment','status'];const rows=S.orders.map(o=>h.map(k=>JSON.stringify(o[k]??'')).join(','));const blob=new Blob([[h.join(','),...rows].join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='reply1988-orders.csv';a.click();URL.revokeObjectURL(a.href)}

document.addEventListener('click',function(e){if(!e.target.closest('.role-dropdown')&&!e.target.closest('.role-toggle-btn')){$('roleDropdown')?.classList.remove('show')}});

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('Copied to clipboard')).catch(()=>toast(text));
  } else toast(text);
}
function product(id){ return MENU.find(x=>x.id===id); }
function add(id,price=null,meta={},amount=1){
  const p=product(id); if(!p||p.active===false)return;
  const key=id+'|'+(meta.temp||'')+'|'+(meta.top||'');
  const found=S.cart.find(x=>x.key===key);
  if(found)found.qty+=amount;
  else S.cart.push({key,id,price:price||p.price,qty:amount,temp:meta.temp||'',top:meta.top||''});
  save(); render(); toast(amount>1?`${amount} added to order`:'Added to order');
}
function updateDraft(key,value){
  S.cartDraft[key]=value; saveDraft();
}
function openProduct(id){
  const p=product(id); if(!p)return;
  window.choice={id, temp:p.temps?.[0]||'',top:'',qty:1};
  $('modal').innerHTML=`<div class="modalCard">
    <div class="drawerHead"><h2>${pname(p)}</h2><button class="close" onclick="closeModal()">×</button></div>
    <div class="detail">
      <div class="detailImg">${p.vi}</div>
      <div>
        <div class="eyebrow muted">${p.cat}</div>
        <div style="font-size:27px;font-weight:800;color:var(--brown);margin:10px 0">${full(p.price)}</div>
        <p class="muted" style="line-height:1.65">${p.desc}</p>
        ${p.temps?`<div style="margin-top:18px"><div class="muted" style="font-size:12px;margin-bottom:7px">Temperature</div><div class="options">${p.temps.map((x,i)=>`<button class="option ${i===0?'active':''}" data-v="${x}" onclick="pickOpt(this,'temp')">${x}</button>`).join('')}</div></div>`:''}
        <div style="margin-top:18px"><div class="muted" style="font-size:12px;margin-bottom:7px">Extra topping</div><div class="options"><button class="option active" data-v="" onclick="pickOpt(this,'top')">None</button>${TOPS.map(x=>`<button class="option" data-v="${x.id}" onclick="pickOpt(this,'top')">${x.name} +${money(x.price)}</button>`).join('')}</div></div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:20px"><span class="muted" style="font-size:12px">Quantity</span><div class="qty"><button onclick="changeModalQty(-1)">−</button><strong id="modalQty">1</strong><button onclick="changeModalQty(1)">+</button></div></div>
        <button class="submit" style="margin-top:22px" onclick="addModal('${id}')">Add to order · <span id="modalTotal">${full(p.price)}</span></button>
      </div>
    </div>
  </div>`;
  $('modal').classList.add('open');
}
function changeModalQty(d){
  window.choice.qty=Math.max(1,window.choice.qty+d);
  const p=product(window.choice.id||'');
  $('modalQty').textContent=window.choice.qty;
  if(p){
    const top=TOPS.find(x=>x.id===window.choice.top);
    $('modalTotal').textContent=full((p.price+(top?.price||0))*window.choice.qty);
  }
}
function pickOpt(btn,type){
  btn.parentElement.querySelectorAll('.option').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  window.choice[type]=btn.dataset.v;
  const p=product(window.choice.id||'');
  if(p){
    const top=TOPS.find(x=>x.id===window.choice.top);
    $('modalTotal').textContent=full((p.price+(top?.price||0))*window.choice.qty);
  }
}
function addModal(id){
  window.choice.id=id;
  const t=TOPS.find(x=>x.id===window.choice.top);
  add(id,product(id).price+(t?.price||0),{temp:window.choice.temp,top:t?.id||''},window.choice.qty);
  closeModal(); openCart();
}
function renderCart(){
  const items=S.cart.map(x=>{
    const p=product(x.id), top=TOPS.find(t=>t.id===x.top);
    return `<div class="cartRow"><div><strong>${pname(p)}</strong><div class="muted" style="font-size:12px;margin-top:4px">${x.temp||''}${top?' · '+top.name:''}</div><div class="price" style="margin-top:6px">${full(x.price*x.qty)}</div></div><div class="qty"><button onclick="qty('${x.key}',-1)">−</button><strong>${x.qty}</strong><button onclick="qty('${x.key}',1)">+</button></div></div>`;
  }).join('');
  $('drawer').innerHTML=`<div class="drawerPanel">
    <div class="drawerHead"><div><div class="eyebrow muted">TABLE ${S.table}</div><h2>Your order</h2></div><button class="close" onclick="closeCart()">×</button></div>
    ${items||'<div class="empty">Your cart is empty.</div>'}
    ${S.cart.length?`<div class="form">
      <div class="total"><span>Total</span><span>${full(total())}</span></div>
      <div class="field"><label>Name (optional)</label><input id="cname" value="${S.cartDraft.name.replace(/"/g,'&quot;')}" oninput="updateDraft('name',this.value)"></div>
      <div class="field"><label>Comment (optional)</label><textarea id="ccomment" oninput="updateDraft('comment',this.value)">${S.cartDraft.comment}</textarea></div>
      <div class="field"><label>Payment</label><select id="pay" onchange="updateDraft('pay',this.value);toggleCash()"><option value="cash" ${S.cartDraft.pay==='cash'?'selected':''}>Cash</option><option value="counter" ${S.cartDraft.pay==='counter'?'selected':''}>Pay at counter</option></select></div>
      <div id="cashBox" class="cashBox" style="display:${S.cartDraft.pay==='cash'?'block':'none'}"><div class="field"><label>I pay with</label><input id="cash" type="number" min="${total()}" placeholder="${total()}" value="${S.cartDraft.cash}" oninput="updateDraft('cash',this.value);calcChange()"></div><div id="change" class="muted" style="font-weight:800;margin-top:7px">Change: ${S.cartDraft.cash?full(Math.max(0,Number(S.cartDraft.cash)-total())):'—'}</div></div>
      <button class="submit" onclick="placeOrder()">Place order · ${money(total())}</button>
      <button class="btn" style="width:100%" onclick="S.cart=[];S.cartDraft={name:'',comment:'',pay:'cash',cash:''};save();saveDraft();render();openCart()">Clear cart</button>
    </div>`:''}
  </div>`;
}
function qty(key,d){
  const x=S.cart.find(i=>i.key===key); if(!x)return;
  x.qty+=d;if(x.qty<=0)S.cart=S.cart.filter(i=>i.key!==key);
  save();render();openCart();
}
function calcChange(){
  const v=Number($('cash')?.value||0), change=$('change');
  if(change)change.textContent='Change: '+(v?full(Math.max(0,v-total())):'—');
}
function placeOrder(){
  const pay=S.cartDraft.pay,cash=Number(S.cartDraft.cash||0);
  if(pay==='cash' && cash<total()){toast('Enter the cash amount the guest will pay');return;}
  const o={id:'R88-'+String(Date.now()).slice(-6),table:S.table,name:S.cartDraft.name.trim(),comment:S.cartDraft.comment.trim(),payment:pay,cash,total:total(),status:'New',items:S.cart.map(x=>({id:x.id,qty:x.qty,temp:x.temp,price:x.price})),createdAt:Date.now()};
  S.orders.unshift(o);S.lastOrderId=o.id;S.cart=[];S.cartDraft={name:'',comment:'',pay:'cash',cash:''};save();saveDraft();closeCart();render();toast('Order sent · '+o.id);setTimeout(()=>showOrder(o.id),250);
}
function showOrder(id){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  const steps=['New','Preparing','Ready','Paid'],cur=steps.indexOf(o.status);
  $('modal').innerHTML=`<div class="modalCard"><div class="drawerHead"><div><div class="eyebrow muted">ORDER CONFIRMED</div><h2>${o.id}</h2></div><button class="close" onclick="closeModal()">×</button></div>
  <div class="muted">Table ${o.table}${o.name?' · '+o.name:''}</div>
  <div style="margin-top:18px;display:grid;gap:9px">${steps.map((s,i)=>`<div style="display:flex;align-items:center;gap:11px;padding:13px;border-radius:15px;background:${i<=cur?'#ebe0d4':'#f7f3ee'}"><span style="font-size:16px">${i<=cur?'●':'○'}</span><strong>${s}</strong></div>`).join('')}</div>
  <div class="infoGrid" style="grid-template-columns:1fr 1fr;margin-top:15px"><div class="info"><strong>${full(o.total)}</strong><span>${o.payment==='cash'?'Cash':'Pay at counter'}</span></div><div class="info"><strong>${o.items.reduce((a,x)=>a+x.qty,0)}</strong><span>Items</span></div></div>
  <div class="actions"><button class="btn" onclick="copyText('${o.id}')">Copy order number</button><button class="btn primary" onclick="closeModal()">Continue browsing</button></div></div>`;
  $('modal').classList.add('open');
}
function status(id,s){
  const o=S.orders.find(x=>x.id===id);if(!o)return;o.status=s;if(s==='Paid')o.paymentStatus='paid';save();render();toast(id+' · '+s);
}
function card(p){
  return `<article class="card" onclick="openProduct('${p.id}')"><div class="pic">${p.vi}${p.hot?'<span class="badge">Best seller</span>':''}</div><div class="body"><div class="title">${pname(p)}</div><div class="desc">${p.desc}</div><div class="foot"><span class="price">${full(p.price)}</span><button class="plus" onclick="event.stopPropagation();add('${p.id}')">+</button></div></div></article>`;
}
function guest(){

  <div class="infoGrid"><div class="info"><strong>About the café</strong><span>${CAFE.address}. Minimal, warm and easy to settle into.</span></div><div class="info"><strong>Opening hours</strong><span>${CAFE.hours}</span></div><div class="info"><strong>Order at table ${S.table}</strong><span>Your QR identifies the table automatically. For delivery, use Grab separately.</span></div></div>
  </div><div class="floating ${count()?'show':''}" onclick="openCart()"><span class="count">${count()}</span><strong>Your order</strong><span>${full(total())}</span></div>`;
}
function orderCard(o){
  const next=o.status==='New'?'Preparing':o.status==='Preparing'?'Ready':'Paid';
  return `<div class="order"><div class="orderTop"><div><strong>${o.id} · Table ${o.table}</strong><div class="muted" style="font-size:12px;margin-top:4px">${o.name||'Guest'} · ${new Date(o.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div><span class="status">${o.status}</span></div><div class="items">${o.items.map(x=>`${x.qty} × ${product(x.id)?.en||x.id}`).join('<br>')}${o.comment?'<br><strong>Note:</strong> '+o.comment:''}</div><div class="orderTop"><strong>${full(o.total)}</strong><span class="muted" style="font-size:12px">${o.payment==='cash'?'Cash':'Counter'}${o.cash?` · Change ${full(Math.max(0,o.cash-o.total))}`:''}</span></div><div class="orderActions"><button class="primary" onclick="status('${o.id}','${next}')">${next==='Paid'?'Mark paid':next}</button><button onclick="showOrder('${o.id}')">View</button><button onclick="toast('Demo: cancellation ready for backend')">Cancel</button></div></div>`;
}
function staff(){
  const filtered=S.orders.filter(o=>{
    const matchFilter=S.orderFilter==='all'||o.status===S.orderFilter;
    const q=S.orderSearch.toLowerCase();
    const matchSearch=!q||o.id.toLowerCase().includes(q)||String(o.table).includes(q)||(o.name||'').toLowerCase().includes(q);
    return matchFilter&&matchSearch;

/* ===== ACTIVE ORDER SAFETY MODEL =====
   One active order per table at a time.
   Active order survives refresh and role switching until status === 'Paid'.
*/
function readActiveOrderMap(){
  try{return JSON.parse(localStorage.getItem('r88_active_orders')||'{}')||{};}catch(e){return {};}
}
function writeActiveOrderMap(map){localStorage.setItem('r88_active_orders',JSON.stringify(map||{}));}
function getActiveOrderForTable(table){
  const t=String(table);
  const map=readActiveOrderMap();
  const mappedId=map[t];
  if(mappedId){
    const mapped=S.orders.find(o=>o.id===mappedId&&String(o.table)===t&&o.status!=='Paid');
    if(mapped)return mapped;
    delete map[t];writeActiveOrderMap(map);
  }
  const found=[...S.orders].filter(o=>String(o.table)===t&&o.status!=='Paid'&&(o.source==='customer'||o.source==='staff-demo')).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0]||null;
  if(found){map[t]=found.id;writeActiveOrderMap(map);}
  return found;
}
function setActiveOrderForTable(order){
  const map=readActiveOrderMap();
  map[String(order.table)]=order.id;
  writeActiveOrderMap(map);
  localStorage.setItem('r88_last_order_id',order.id);
}
function clearActiveOrderForTable(table,orderId=''){
  const map=readActiveOrderMap();
  const t=String(table);
  if(!orderId||map[t]===orderId)delete map[t];
  writeActiveOrderMap(map);
  if(orderId&&localStorage.getItem('r88_last_order_id')===orderId)localStorage.removeItem('r88_last_order_id');
}
function activeOrderLockMessage(o){
  return `Order ${o.id} is still active. Please wait until it is paid at the café before placing another order.`;
}
function latestCabinetOrder(){
  const active=getActiveOrderForTable(S.table);
  if(active)return active;
  const saved=localStorage.getItem('r88_last_order_id');
  if(saved){const hit=S.orders.find(o=>o.id===saved&&String(o.table)===String(S.table));if(hit)return hit;}
  return cabinetOrders().find(o=>o.status==='Paid')||null;
}
function cabinetStatusIndex(status){return ['New','Preparing','Ready','Paid'].indexOf(status);}
function cabinetStatusLabel(status){return status==='New'?'Order received':status==='Preparing'?'Preparing':status==='Ready'?'Ready for you':'Paid & completed';}

/* Never create a second order for the same table while the first is unpaid. */
function placeOrder(){
  if(!S.cart.length){toast('Your cart is empty');return;}
  const active=getActiveOrderForTable(S.table);
  if(active){toast(activeOrderLockMessage(active));closeCart();setTimeout(()=>openOrderCabinet(),120);return;}
  const pay=document.getElementById('pay')?.value||S.cartDraft.pay||'cash';
  const cash=Number(document.getElementById('cash')?.value||S.cartDraft.cash||0);
  if(pay==='cash'&&cash<total()){toast('Enter the cash amount the guest will pay');return;}
  const o={
    id:'R88-'+String(Date.now()).slice(-6),
    table:String(S.table),
    name:(document.getElementById('cname')?.value||S.cartDraft.name||'').trim(),
    comment:(document.getElementById('ccomment')?.value||S.cartDraft.comment||'').trim(),
    payment:pay,
    cash,
    total:total(),
    status:'New',
    paymentStatus:'pending',
    source:'customer',
    items:S.cart.map(x=>({id:x.id,qty:x.qty,temp:x.temp,price:x.price,top:x.top||''})),
    createdAt:Date.now()
  };
  S.orders.unshift(o);
  S.cart=[];
  S.cartDraft={name:'',comment:'',pay:'cash',cash:''};
  setActiveOrderForTable(o);
  save();
  if(typeof saveDraft==='function')saveDraft();
  closeCart();
  render();
  toast('Order sent · '+o.id);
  setTimeout(()=>openOrderCabinet(),180);
}

/* Prevent menu actions from accidentally starting a second order. */
function add(id,price=null,meta={},amount=1){
  const active=getActiveOrderForTable(S.table);
  if(active){toast(activeOrderLockMessage(active));setTimeout(()=>openOrderCabinet(),120);return;}
  const p=product(id);if(!p||p.active===false)return;
  const key=id+'|'+(meta.temp||'')+'|'+(meta.top||'');
  const found=S.cart.find(x=>x.key===key);
  if(found)found.qty+=amount;
  else S.cart.push({key,id,price:price||p.price,qty:amount,temp:meta.temp||'',top:meta.top||''});
  save();render();toast(amount>1?`${amount} added to order`:'Added to order');
}

}

/* Reordering is allowed only after payment of the previous order. */
function reorderOrder(id){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  const active=getActiveOrderForTable(S.table);
  if(active){toast(activeOrderLockMessage(active));openOrderCabinet();return;}
  let added=0;
  (o.items||[]).forEach(x=>{const p=product(x.id);if(!p)return;const key=x.id+'|'+(x.temp||'')+'|'+(x.top||'');const found=S.cart.find(i=>i.key===key);if(found)found.qty+=x.qty;else S.cart.push({key,id:x.id,price:x.price||p.price,qty:x.qty,temp:x.temp||'',top:x.top||''});added+=x.qty;});
  save();render();toast(`${added} item${added===1?'':'s'} added to cart`);setTimeout(()=>openCart(),120);
}

/* Status flow is monotonic and completing payment releases the table for the next order. */
function status(id,s){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  const flow=['New','Preparing','Ready','Paid'];
  const from=flow.indexOf(o.status),to=flow.indexOf(s);
  if(to<0||from<0||to<from){toast('Order status cannot move backwards');return;}
  if(to>from+1){toast('Move the order through the next status first');return;}
  o.status=s;
  if(s==='Paid'){o.paymentStatus='paid';clearActiveOrderForTable(o.table,o.id);}
  save();render();toast(id+' · '+s);
}

/* Staff demo orders must also respect one active order per table. */
function simulate(){
  const occupied=new Set(S.orders.filter(o=>o.status!=='Paid').map(o=>String(o.table)));
  const available=Array.from({length:24},(_,i)=>String(i+1).padStart(2,'0')).filter(t=>!occupied.has(t));
  if(!available.length){toast('All tables already have active orders');return;}
  const table=available[Math.floor(Math.random()*available.length)];
  const o={id:'R88-'+String(Date.now()).slice(-6),table,name:'Demo Guest',comment:'Less ice',payment:'cash',cash:100000,total:45000,status:'New',paymentStatus:'pending',source:'staff-demo',items:[{id:'egg',qty:1,price:45000}],createdAt:Date.now()};
  S.orders.unshift(o);setActiveOrderForTable(o);save();render();toast(`New order · Table ${table}`);
}

/* The cabinet always prioritizes the one active order. Once paid, history remains available. */
function orderCabinetMain(){
  const o=latestCabinetOrder();
  if(!o){return `<div class="order-cabinet-main oc-empty"><div class="oc-empty-inner"><div class="oc-empty-icon">☕</div><h3>Your table is ready.</h3><p>No order has been placed from table ${S.table} yet. Explore the menu, choose your drinks and follow everything here after you order.</p><div class="oc-actions" style="justify-content:center"><button class="oc-btn primary" onclick="brandScroll('menu')">Explore menu</button><button class="oc-btn soft" onclick="openCart()">Open cart · ${count()}</button></div></div></div>`;}
  const active=getActiveOrderForTable(S.table);
  const steps=['New','Preparing','Ready','Paid'];
  const cur=Math.max(0,cabinetStatusIndex(o.status));
  const items=o.items||[];const change=o.cash?Math.max(0,o.cash-o.total):0;
  const isActive=!!active&&active.id===o.id;
  return `<div class="order-cabinet-main"><div class="oc-kicker">${isActive?'Active order':'Latest completed order'} · Table ${o.table}</div><div class="oc-title-row"><div><h3 class="oc-title">${o.id}</h3><div class="oc-sub">${o.name||'Guest'} · ${new Date(o.createdAt||Date.now()).toLocaleString()}</div></div><div class="oc-pill"><span class="oc-dot"></span>${cabinetStatusLabel(o.status)}</div></div><div class="oc-progress">${steps.map((s,i)=>`<div class="oc-step ${i<cur?'done ':''}${i===cur?'active':''} "><span>${s}</span></div>`).join('')}</div><div class="oc-detail-grid"><div class="oc-detail-box"><small>Table</small><strong>${o.table}</strong></div><div class="oc-detail-box"><small>Total</small><strong>${full(o.total)}</strong></div><div class="oc-detail-box"><small>Payment</small><strong>${o.payment==='cash'?'Cash at café':'Pay at counter'}</strong></div><div class="oc-detail-box"><small>${o.cash?'Change':'Status'}</small><strong>${o.cash?full(change):cabinetStatusLabel(o.status)}</strong></div></div><div class="oc-items">${items.map(x=>`<div class="oc-item"><span>${x.qty} × ${product(x.id)?.en||x.id}${x.temp?' · '+x.temp:''}</span><span>${full((x.price||0)*x.qty)}</span></div>`).join('')}</div>${o.comment?`<div class="oc-status-note"><strong>Note:</strong> ${o.comment}</div>`:''}<div class="oc-actions"><button class="oc-btn primary" onclick="showOrder('${o.id}')">View full order</button>${isActive?`<button class="oc-btn soft" onclick="openCart()">Current order · ${o.status}</button>`:`<button class="oc-btn soft" onclick="reorderOrder('${o.id}')">Order again</button>`}<button class="oc-btn" onclick="copyText('${o.id}')">Copy order number</button></div>${isActive?`<div class="oc-status-note"><strong>One active order at a time.</strong> This order stays active until the café marks it as paid. Only after payment can a new order be placed.</div>`:''}</div>`;
}

/* Move the history block below the active order instead of keeping it as a sticky side panel. */
function orderCabinetSide(){
  const orders=cabinetOrders();
  const totalSpent=orders.reduce((a,o)=>a+(o.total||0),0);
  return `<div class="oc-summary"><div class="oc-summary-card"><strong>${orders.length}</strong><span>Orders from table ${S.table}</span></div><div class="oc-summary-card"><strong>${full(totalSpent)}</strong><span>Total order value</span></div><div class="oc-summary-card"><strong>${orders.filter(o=>o.status==='Paid').length}</strong><span>Completed orders</span></div></div><div style="height:18px"></div><div class="oc-history-head"><h3>Order history</h3><span class="oc-history-count">${orders.length} total</span></div><div class="oc-history">${orders.length?orders.map(o=>`<div class="oc-history-row"><div><strong>${o.id} · ${full(o.total)}</strong><small>${new Date(o.createdAt||Date.now()).toLocaleString()} · ${o.status}</small></div><div class="oc-history-actions"><button class="oc-mini-btn" onclick="showOrder('${o.id}')">View</button>${o.status==='Paid'?`<button class="oc-mini-btn" onclick="reorderOrder('${o.id}')">↻</button>`:''}</div></div>`).join(''):`<div class="oc-history-row"><div><strong>No previous orders</strong><small>They will appear here after the first order.</small></div></div>`}</div><div class="oc-status-note">The active order is retained until payment. Completed orders remain in history.</div>`;
}

/* Reset demo also clears the active-order lock map. */
function resetDemo(){
  if(!confirm('Reset demo orders, menu edits and settings?'))return;
  ['r88_orders','r88_menu','r88_cafe','r88_staff','r88_cart','r88_cartDraft','r88_active_orders','r88_last_order_id'].forEach(k=>localStorage.removeItem(k));
  location.reload();
}

/* Compact QA helper for the current order model. */
window.runOrderStressTest=function(){
  const originalOrders=S.orders, originalTable=S.table, originalCart=S.cart, originalMap=localStorage.getItem('r88_active_orders');
  const results=[];const check=(name,fn)=>{try{const ok=!!fn();results.push({name,ok});}catch(e){results.push({name,ok:false,error:String(e)});}};
  S.orders=[];S.cart=[];S.table='99';localStorage.removeItem('r88_active_orders');
  check('No active order initially',()=>!getActiveOrderForTable('99'));
  const o1={id:'TEST-1',table:'99',status:'New',total:10000,items:[],createdAt:1};S.orders=[o1];setActiveOrderForTable(o1);
  check('Active order persists by table',()=>getActiveOrderForTable('99')?.id==='TEST-1');
  check('Second active order is blocked',()=>{const active=getActiveOrderForTable('99');return !!active&&active.id==='TEST-1'});
  check('Refresh-style lookup keeps order',()=>{const hit=getActiveOrderForTable('99');return !!hit&&hit.status==='New'});
  o1.status='Preparing';check('Preparing remains active',()=>getActiveOrderForTable('99')?.id==='TEST-1');
  o1.status='Ready';check('Ready remains active',()=>getActiveOrderForTable('99')?.id==='TEST-1');
  o1.status='Paid';clearActiveOrderForTable('99','TEST-1');check('Paid releases table',()=>!getActiveOrderForTable('99'));
  const o2={id:'TEST-2',table:'99',status:'New',total:20000,items:[],createdAt:2};S.orders=[o1,o2];setActiveOrderForTable(o2);check('New order can start only after payment',()=>getActiveOrderForTable('99')?.id==='TEST-2');
  S.orders=originalOrders;S.table=originalTable;S.cart=originalCart;if(originalMap===null)localStorage.removeItem('r88_active_orders');else localStorage.setItem('r88_active_orders',originalMap);return results;
};

render();
</script>
